{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <h2 class="text-center mb-4"><i class="fas fa-sign-in-alt text-primary me-2"></i>Login</h2>
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-bold">User ID</label>
                        <input type="text" name="userid" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>
                <div class="text-center mt-4">
                    <small class="text-muted">No account? <a href="{{ url_for('employees') }}">Create Employee</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
